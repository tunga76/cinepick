name: publish-containers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "deploy/**"
      - "Dockerfile.api"
      - "Dockerfile.frontend"
      - ".github/workflows/publish-containers.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/tunga76/cinepick-api:latest
            ghcr.io/tunga76/cinepick-api:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/tunga76/cinepick-web:latest
            ghcr.io/tunga76/cinepick-web:${{ github.sha }}